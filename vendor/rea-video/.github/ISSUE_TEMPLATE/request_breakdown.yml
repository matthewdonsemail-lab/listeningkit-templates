name: 求拆解
description: 有条视频想知道是怎么做的？贴链接，我们拆完发成案例。
title: "[求拆解] "
labels: ["求拆解"]
body:
  - type: markdown
    attributes:
      value: |
        拆完的结果会发到 [docs/cases.md](https://github.com/JuneYaooo/rea-video/blob/main/docs/cases.md)，附逐镜头拼帧和报告。请只提交你有权分享的公开视频。
  - type: input
    id: link
    attributes:
      label: 视频链接
      description: 抖音、B 站、小红书、YouTube、TikTok 都行。没有链接就说明怎么找到它。
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: want
    attributes:
      label: 最想知道什么
      multiple: true
      options:
        - 是实拍、AI 还是代码做的
        - 实拍怎么拍（机位、布光、调色）
        - AI 镜头的提示词和用哪个模型
        - 字幕、花字、剪辑节奏
        - 配乐和音效是怎么来的
        - 整条怎么复刻、要花多少钱
    validations:
      required: true
  - type: textarea
    id: guess
    attributes:
      label: 你自己的判断
      description: 可不填。你觉得它是怎么做的、哪里看不出来，写下来方便对照。
  - type: checkboxes
    id: publish
    attributes:
      label: 发布
      options:
        - label: 同意把拆解结果作为公开案例发在仓库里
          required: true
